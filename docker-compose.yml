services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: xhs_health
      POSTGRES_USER: xhs
      POSTGRES_PASSWORD: xhs_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xhs -d xhs_health"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://xhs:xhs_pass@postgres:5432/xhs_health
      API_PREFIX: /api/v1
      # Local-development default. Override APP_API_TOKEN outside local Compose.
      APP_API_TOKEN: ${APP_API_TOKEN:-xhs-local-dev-token}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:

